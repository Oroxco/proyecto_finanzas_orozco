<ion-tabs>
  <ion-tab-bar slot="bottom" color="dark">
    
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon name="triangle"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <!-- Solo se renderiza si esAdmin es true -->
    <ion-tab-button *ngIf="esAdmin" tab="tab2" href="/tabs/tab2">
      <ion-icon name="ellipse"></ion-icon>
      <ion-label>Gestión</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon name="square"></ion-icon>
      <ion-label>Resumen</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="origen-datos" href="/tabs/origen-datos">
      <ion-icon name="server-outline"></ion-icon>
      <ion-label>Origen de datos</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
