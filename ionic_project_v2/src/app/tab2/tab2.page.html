<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Gestión de Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-label position="stacked">Nombre</ion-label>
      <ion-input type="text" [(ngModel)]="nuevoUsuario.nombre" placeholder="Nombre completo"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Correo Electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="nuevoUsuario.email" placeholder="correo@ejemplo.com"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="primary" class="ion-margin-top" (click)="agregarUsuario()">
    AGREGAR USUARIO
  </ion-button>

  <h2 style="margin-top: 2rem;">Lista de Usuarios</h2>

  <ion-list>
    <ion-item *ngFor="let user of usuarios">
      <ion-label>
        <h2>{{ user.nombre }}</h2>
        <p>{{ user.email }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" fill="clear" (click)="eliminarUsuario(user.id)">
        ELIMINAR
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
