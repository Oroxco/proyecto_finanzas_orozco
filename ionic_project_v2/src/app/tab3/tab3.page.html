<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-title>Dashboard de Finanzas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="dark">
  
  <ion-row>
    <!-- Tarjeta Balance -->
    <ion-col size="12" size-md="6">
      <ion-card color="primary" class="ion-no-margin ion-margin-bottom">
        <ion-card-header>
          <ion-card-title style="font-size: 2rem; font-weight: bold;">${{ balanceTotal | number:'1.2-2' }}</ion-card-title>
          <ion-card-subtitle color="light">Balance Actual en Cuentas</ion-card-subtitle>
        </ion-card-header>
      </ion-card>
    </ion-col>

    <!-- Tarjeta Ingresos Totales -->
    <ion-col size="12" size-md="6">
      <ion-card color="success" class="ion-no-margin ion-margin-bottom">
        <ion-card-header>
          <ion-card-title style="font-size: 2rem; font-weight: bold;">${{ ingresosTotales | number:'1.2-2' }}</ion-card-title>
          <ion-card-subtitle color="light">Ingresos Brutos Históricos</ion-card-subtitle>
        </ion-card-header>
      </ion-card>
    </ion-col>
  </ion-row>

  <!-- Gráfica de Flujo -->
  <ion-card style="background: #1e1e1e; border-radius: 8px;">
    <ion-card-header>
      <ion-card-title color="light" style="font-size: 1.1rem;">Flujo de Efectivo</ion-card-title>
    </ion-card-header>
    <ion-card-content style="height: 300px; padding: 10px;">
      <canvas #graficaCanvas></canvas>
    </ion-card-content>
  </ion-card>

</ion-content>
